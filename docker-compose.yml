
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: portal-frases-backend:1.0
    container_name: quotes_backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - frases_data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portal-frases-frontend:1.0
    container_name: quotes_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  frases_data:
